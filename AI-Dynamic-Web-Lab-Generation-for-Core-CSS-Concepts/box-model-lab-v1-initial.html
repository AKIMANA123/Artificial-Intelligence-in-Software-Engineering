<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Box Model &amp; Display Lab (Initial)</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f4f6f8;color:#222}
h1{font-size:1.3rem;margin:0 0 12px}
.wrap{display:flex;gap:20px;flex-wrap:wrap}
.panel{background:#fff;padding:16px;border-radius:8px;width:290px;box-shadow:0 1px 4px #0002}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.9rem}
.row label{width:90px}.row input{flex:1}.row output{width:48px;text-align:right;font-variant-numeric:tabular-nums}
select{flex:1;padding:4px}
#stage{flex:1;min-width:320px;background:#fff;padding:30px;border-radius:8px;box-shadow:0 1px 4px #0002;line-height:1.2}
#box1{box-sizing:content-box;border:10px solid #1c3d5a;color:#111;font-weight:600;
 background-image:linear-gradient(#ffd166,#ffd166),linear-gradient(#74c0fc,#74c0fc);
 background-clip:content-box,padding-box;background-origin:content-box,padding-box}
#box2{display:inline-block;width:120px;height:60px;background:#b197fc;color:#fff;box-sizing:border-box;padding:8px}
.legend span{display:inline-block;padding:2px 8px;margin:0 6px 6px 0;border-radius:4px;font-size:.8rem}
.note{font-size:.8rem;color:#555;margin-top:10px}
</style></head><body>
<h1>CSS Box Model &amp; Display Lab</h1>
<div class="wrap">
<div class="panel">
 <div class="row"><label for="pad">Padding</label><input id="pad" type="range" min="0" max="80" value="20"><output id="padV"></output></div>
 <div class="row"><label for="mar">Margin</label><input id="mar" type="range" min="0" max="80" value="20"><output id="marV"></output></div>
 <div class="row"><label for="bor">Border width</label><input id="bor" type="range" min="0" max="30" value="10"><output id="borV"></output></div>
 <div class="row"><label for="wid">Width</label><input id="wid" type="range" min="40" max="400" value="160"><output id="widV"></output></div>
 <div class="row"><label for="disp">Display</label><select id="disp"><option>block</option><option>inline-block</option><option>inline</option></select></div>
 <div class="legend"><span style="background:#ffd166">Content</span><span style="background:#74c0fc">Padding</span><span style="background:#1c3d5a;color:#fff">Border</span><span style="background:#ffa07a">Margin</span></div>
 <p class="note">Try <b>inline</b>: width and vertical margin are ignored.</p>
</div>
<div id="stage"><div id="box1">Box 1</div><div id="box2">Box 2</div></div>
</div>
<script>
const $=id=>document.getElementById(id),b=$('box1');
function update(){
 const p=$('pad').value,m=$('mar').value,w=$('bor').value,wd=$('wid').value;
 b.style.padding=p+'px';b.style.margin=m+'px';b.style.borderWidth=w+'px';b.style.width=wd+'px';
 b.style.display=$('disp').value;
 b.style.boxShadow='0 0 0 '+m+'px rgba(255,160,122,.55)'; /* spread shadow paints the margin area */
 $('padV').textContent=p+'px';$('marV').textContent=m+'px';$('borV').textContent=w+'px';$('widV').textContent=wd+'px';
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',update));
update();
</script></body></html>
